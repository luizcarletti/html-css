<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>Teste de formulario</h1>
    <form action="#" method="get" autocomplete="on">
        <p>
            <label for="inome" >Nome</label>
            <input type="text" name="nome" id="inome" required maxlength="50" placeholder="Digite seu nome" autocomplete="name">
        </p>
        <p>
            <label for="imedia" >Media</label>
            <input type="number" name="number" id="imedia" min="0" max="10" placeholder="Nota" step="0.1" required>
        </p>
        <p>
            <label for="imes">Mes</label>
            <input type="month" name="mes" id="imes">
        </p>
        <p>
            <label for="idata">Data da prova</label>
            <input type="date" name="data" id="idata">
        </p>
        <p>
            <label for="itime">Hora da prova</label>
            <input type="time" name="hora" id="itime">
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
